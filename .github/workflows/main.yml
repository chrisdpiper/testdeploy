name: Build and Deploy

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Show build output
        run: |
          echo "Build output:"
          cat time.txt
          ls -l time.txt

      - name: Run mover
        run: |
          /home/chris/code/venv/bin/python3 \
            /home/chris/code/mover.py \
            "$GITHUB_WORKSPACE/time.txt"
