name: Build and Deploy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          ./build.sh

      - name: Save build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/your-file
          
  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: /home/chris/code/upload

      - name: Check downloaded file
        run: |
          echo "Downloaded files:"
          ls -la /home/chris/code/upload

      - name: Run mover
        run: |
          cd /home/chris/code
          ./venv/bin/python3 mover.py /home/chris/code/upload/your-file
