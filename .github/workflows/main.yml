name: Run NUC Script

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Check runner
        run: |
          echo "Hostname:"
          hostname

          echo "Architecture:"
          uname -m

          echo "Python:"
          python3 --version

          echo "Script:"
          ls -l /home/chris/code/*.py

      - name: Run script
        run: |
          cd /home/chris/code
          ./venv/bin/python3 mover.py
