name: Build and Deploy

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Test runner
        run: |
          echo "RUNNER IS WORKING"
          echo "User:"
          whoami
          echo "Home:"
          echo "$HOME"
          echo "Hostname:"
          hostname

      - name: Check code directory
        run: |
          echo "Checking /home/chris/code"
          ls -la /home/chris/code

      - name: Run build
        run: |
          echo "STARTING BUILD"
          cd /home/chris/code
          echo "Current directory:"
          pwd
          echo "Build script:"
          ls -l build.sh
          echo "Running build.sh..."
          bash -x ./build.sh
          echo "Build finished"
          echo "Checking time.txt:"
          ls -l time.txt
          cat time.txt

      - name: Run mover
        run: |
          echo "STARTING MOVER"
          /home/chris/code/venv/bin/python3 --version
          /home/chris/code/venv/bin/python3 \
            /home/chris/code/mover.py \
            /home/chris/code/time.txt
